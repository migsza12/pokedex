<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Ultra - Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="pokedex-container wide">
        <h1>Pokédex <span>Ultra</span></h1>
        
        <div class="search-filter-container">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Busque por nome ou forma (ex: pika, mega, alola)..."
            >
            
            <select id="type-filter">
                <option value="">Todos os Tipos</option>
                <option value="normal">Normal</option>
                <option value="fire">Fogo</option>
                <option value="water">Água</option>
                <option value="grass">Planta</option>
                <option value="electric">Elétrico</option>
                <option value="ice">Gelo</option>
                <option value="fighting">Lutador</option>
                <option value="poison">Venenoso</option>
                <option value="ground">Terra</option>
                <option value="flying">Voador</option>
                <option value="psychic">Psíquico</option>
                <option value="bug">Inseto</option>
                <option value="rock">Pedra</option>
                <option value="ghost">Fantasma</option>
                <option value="dragon">Dragão</option>
                <option value="dark">Sombrio</option>
                <option value="steel">Aço</option>
                <option value="fairy">Fada</option>
            </select>
        </div>

        <div id="pokedex-grid" class="pokedex-grid">
            <p class="loading">Invocando a base de dados global...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
